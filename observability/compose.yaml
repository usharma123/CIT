name: cit-observability
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mocknet
      POSTGRES_USER: mocknet
      POSTGRES_PASSWORD: ${MOCKNET_DB_PASSWORD:?Set using launcher}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocknet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=72h", "--storage.tsdb.retention.size=2GB"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:19090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:13100:3100"]
    restart: unless-stopped
  collector-storage:
    image: busybox:1.37.0
    user: "0"
    command: ["chown", "10001:10001", "/var/lib/otelcol"]
    volumes:
      - collector-data:/var/lib/otelcol
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
  collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    command: ["--config=/etc/otelcol.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol.yaml:ro
      - collector-data:/var/lib/otelcol
    ports:
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      tempo:
        condition: service_started
      collector-storage:
        condition: service_completed_successfully
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.4.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Allow local support viewers to follow trace-to-logs links into Explore.
      # Dashboard definitions remain provisioned and cannot be saved by viewers.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      MOCKNET_READER_PASSWORD: ${MOCKNET_READER_PASSWORD:?Set using launcher}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: demo-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD using the launcher}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mocknet.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./approach-b/grafana:/var/lib/grafana/approach-b:ro
      - ./approach-c/grafana:/var/lib/grafana/approach-c:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on: [tempo]
    restart: unless-stopped
volumes:
  tempo-data:
  collector-data:
  grafana-data:
  postgres-data:
  prometheus-data:
  loki-data:
