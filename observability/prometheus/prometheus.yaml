global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: mocknet
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:18082]
        labels:
          service: mocknet
          environment: local-demo
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
