apiVersion: 1
datasources:
  - name: Approach C pooled logs and journals
    type: grafana-postgresql-datasource
    uid: mocknet-c-reporting
    access: proxy
    url: host.docker.internal:15452
    user: grafana_c
    editable: false
    jsonData:
      database: telemetry_c
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 300
    secureJsonData:
      password: $MOCKNET_READER_PASSWORD
