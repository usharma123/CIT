name: cit-observability-c
services:
  grafana-c:
    image: grafana/grafana:12.4.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${MOCKNET_C_DEMO_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: demo-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Use local secret file}
      MOCKNET_READER_PASSWORD: ${MOCKNET_READER_PASSWORD:?Use local secret file}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/approach-c/mocknet-c-business.json
    ports: ["127.0.0.1:3302:3000"]
    volumes:
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/provisioning/datasources/approach-c.yaml:/etc/grafana/provisioning/datasources/approach-c.yaml:ro
      - ./telemetry/datasources.yaml:/etc/grafana/provisioning/datasources/telemetry.yaml:ro
      - ./grafana:/var/lib/grafana/approach-c:ro
      - grafana-c-data:/var/lib/grafana
    depends_on:
      postgres-c:
        condition: service_healthy
    restart: unless-stopped
  postgres-c:
    image: postgres:17.6-alpine
    # Docker's 64 MB /dev/shm is too small for parallel reporting queries.
    shm_size: 512mb
    environment:
      POSTGRES_DB: mocknet_c
      POSTGRES_USER: mocknet_c
      POSTGRES_PASSWORD: ${MOCKNET_DB_PASSWORD:?Use local secret file}
    ports: ["127.0.0.1:15452:5432"]
    volumes: ["postgres-c-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocknet_c -d mocknet_c"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  tempo-c:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./telemetry/tempo.yaml:/etc/tempo.yaml:ro", "tempo-c-data:/var/tempo"]
    ports: ["127.0.0.1:3202:3200", "127.0.0.1:24318:4318"]
    restart: unless-stopped
  loki-c:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki.yaml"]
    volumes: ["../loki.yaml:/etc/loki.yaml:ro", "loki-c-data:/loki"]
    ports: ["127.0.0.1:13102:3100"]
    restart: unless-stopped
  prometheus-c:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=72h", "--storage.tsdb.retention.size=2GB"]
    volumes: ["./prometheus:/etc/prometheus:ro", "prometheus-c-data:/prometheus"]
    ports: ["127.0.0.1:19092:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
volumes:
  postgres-c-data:
  grafana-c-data:
  tempo-c-data:
  loki-c-data:
  prometheus-c-data:
