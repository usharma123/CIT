apiVersion: 1
datasources:
  - name: C reconstructed traces
    type: tempo
    uid: mocknet-c-tempo
    access: proxy
    url: http://tempo-c:3200
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph: {enabled: true}
      search: {hide: false}
      tracesToLogsV2:
        datasourceUid: mocknet-c-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        tags: [{key: service.name, value: service_name}]
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: mocknet-c-prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags: [{key: service.name, value: service}]
        queries:
          - name: Database pool waiting
            query: 'hikaricp_connections_pending{$$__tags}'
          - name: JVM heap used
            query: 'sum(jvm_memory_used_bytes{$$__tags,area="heap"})'
  - name: C runtime and queue metrics
    type: prometheus
    uid: mocknet-c-prometheus
    access: proxy
    url: http://prometheus-c:9090
    editable: false
    jsonData: {httpMethod: POST, timeInterval: 5s}
  - name: C application logs and source evidence
    type: loki
    uid: mocknet-c-loki
    access: proxy
    url: http://loki-c:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: trace_id
          matcherType: label
          datasourceUid: mocknet-c-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open reconstructed trace
